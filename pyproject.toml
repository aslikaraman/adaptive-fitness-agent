[project]
name = "adaptive-fitness-agent"
version = "0.1.0"
description = "Adaptive Fitness Agent - Design Patterns UE, TU Graz (WS 2026/27)"
requires-python = ">=3.11"

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not ollama'"
markers = [
    "ollama: integration test that needs a running local Ollama (run with: pytest -m ollama)",
]

[tool.coverage.run]
source = ["fitness_agent"]

# ---------------------------------------------------------------------------
# Layer rules (coupling metric). Run with:  lint-imports
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "fitness_agent"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: dependencies point inward only"
type = "layers"
layers = [
    "fitness_agent.interface",
    "fitness_agent.infrastructure",
    "fitness_agent.application",
    "fitness_agent.domain",
]

[[tool.importlinter.contracts]]
name = "Domain and application do not depend on LangChain or Ollama"
type = "forbidden"
source_modules = [
    "fitness_agent.domain",
    "fitness_agent.application",
]
forbidden_modules = [
    "langchain",
    "langchain_core",
    "langchain_ollama",
    "ollama",
]
